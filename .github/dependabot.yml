version: 2
updates:
  # ── 1. Frontend dependencies (Yarn / npm root workspace) ─────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 15
    reviewers:
      - "Obiajulu-gif"
    labels:
      - "dependencies"
      - "automated"
      - "frontend"
    commit-message:
      prefix: "deps"
    groups:
      patch-and-minor-deps:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      radix:
        patterns:
          - "@radix-ui/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      stellar:
        patterns:
          - "@stellar/*"
          - "@creit.tech/*"
      sentry:
        patterns:
          - "@sentry/*"

  # ── 2. Backend dependencies (npm server workspace) ──────────────────────────
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "Obiajulu-gif"
    labels:
      - "dependencies"
      - "automated"
      - "server"
    commit-message:
      prefix: "deps(server)"
    groups:
      patch-and-minor-server-deps:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # ── 3. Rust smart contracts (Cargo workspace root) ──────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "Obiajulu-gif"
    labels:
      - "dependencies"
      - "automated"
      - "rust"
      - "contracts"
    commit-message:
      prefix: "deps(contracts)"
    groups:
      patch-and-minor-cargo:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # ── 4. GitHub Actions Workflows ──────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "Obiajulu-gif"
    labels:
      - "dependencies"
      - "automated"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
    groups:
      patch-and-minor-actions:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
