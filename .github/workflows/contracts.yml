name: Contracts CI

on:
  pull_request:
    paths:
      - ".github/workflows/contracts.yml"
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/contracts.yml"
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    name: Format, Lint, Test, Build Soroban Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build release Wasm artifacts
        run: cargo build --workspace --release --target wasm32v1-none --locked

      - name: Upgrade preflight self-check (#435)
        run: python3 scripts/preflight_upgrade.py check --self-check

      - name: Set up Node.js for ABI conformance tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies for ABI conformance tests
        run: npm ci
        working-directory: ./

      - name: Generate ABI fixtures from contract spec
        run: node tests/abi-conformance/scripts/generate-fixtures.ts

      - name: Run ABI conformance tests
        run: npm test -- tests/abi-conformance/validators/

      - name: Generate compatibility report
        run: node tests/abi-conformance/scripts/compatibility-report.ts

      - name: Check for uncommitted fixture changes
        run: |
          if [ -n "$(git diff --name-only tests/abi-conformance/fixtures/)" ]; then
            echo "❌ ABI fixtures have changed. Please regenerate and commit the updated fixtures."
            echo "Run: node tests/abi-conformance/scripts/generate-fixtures.ts"
            git diff tests/abi-conformance/fixtures/
            exit 1
          fi
