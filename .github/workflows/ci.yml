name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Rust smart contracts ──────────────────────────────────────────────────
  contracts:
    name: Contracts (Rust)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting check
        run: |
          git fetch origin main --depth=1 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^(contracts/|Cargo\.)'; then
            echo "No contract changes detected; skipping formatting check."
          else
            cargo fmt --all -- --check
          fi

      - name: Clippy (deny warnings)
        run: |
          git fetch origin main --depth=1 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^(contracts/|Cargo\.)'; then
            echo "No contract changes detected; skipping contract clippy."
          else
            cargo clippy --all-targets --all-features -- -D warnings
          fi

      - name: Unit tests
        run: |
          git fetch origin main --depth=1 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^(contracts/|Cargo\.)'; then
            echo "No contract changes detected; skipping contract tests."
          else
            cargo test --all
          fi

      - name: Build WASM
        run: |
          git fetch origin main --depth=1 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^(contracts/|Cargo\.)'; then
            echo "No contract changes detected; skipping contract WASM build."
          else
            cargo build --release --target wasm32v1-none
          fi
        env:
          # soroban-sdk 27's spec-shaking feature otherwise requires building
          # through `stellar contract build` (stellar-cli v25.2.0+); this is
          # the same flag that CLI sets internally.
          SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2: "1"

  # ── TypeScript frontend ───────────────────────────────────────────────────
  frontend:
    name: Frontend (TypeScript / Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          git fetch origin main --depth=1 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^(src/|packages/|package\.json|yarn\.lock|\.yarn)'; then
            echo "No frontend changes detected; skipping immutable install."
          else
            yarn install --immutable
          fi

      - name: Policy check (production build rules)
        run: |
          git fetch origin main --depth=1 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^(src/|packages/|package\.json|yarn\.lock|\.yarn)'; then
            echo "No frontend changes detected; skipping policy check."
          else
            yarn check:policy
          fi

      - name: Validate dependency and license inventory (#1097)
        run: |
          git fetch origin main --depth=1 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^(src/|packages/|package\.json|yarn\.lock|\.yarn)'; then
            echo "No frontend changes detected; creating placeholder inventory."
            echo "{}" > dependency-license-inventory.json
          else
            node scripts/validate-dependencies-and-licenses.mjs --ci --output dependency-license-inventory.json
          fi

      - name: Upload dependency and license inventory artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-license-inventory
          path: dependency-license-inventory.json
          retention-days: 30

      - name: Typecheck
        run: |
          git fetch origin main --depth=1 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^(src/|packages/|package\.json|yarn\.lock|\.yarn)'; then
            echo "No frontend changes detected; skipping typecheck."
          else
            yarn typecheck
          fi

      - name: Lint
        run: |
          git fetch origin main --depth=1 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^(src/|packages/|package\.json|yarn\.lock|\.yarn)'; then
            echo "No frontend changes detected; skipping lint."
          else
            yarn lint
          fi

      - name: Build
        run: |
          git fetch origin main --depth=1 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^(src/|packages/|package\.json|yarn\.lock|\.yarn)'; then
            echo "No frontend changes detected; skipping build."
          else
            yarn build
          fi
        env:
          PUBLIC_STELLAR_NETWORK: "TESTNET"
          PUBLIC_STELLAR_RPC_URL: "https://soroban-testnet.stellar.org"
          PUBLIC_PROMPT_HASH_CONTRACT_ID: "CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD2KM"

      - name: Frontend tests
        run: |
          git fetch origin main --depth=1 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^(src/|packages/|package\.json|yarn\.lock|\.yarn)'; then
            echo "No frontend changes detected; skipping frontend tests."
          else
            yarn test:frontend
          fi

  # ── Express API / server ──────────────────────────────────────────────────
  api:
    name: API (Express / server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          git fetch origin main --depth=1 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^server/'; then
            echo "No backend changes detected; skipping npm ci."
          else
            npm ci
          fi

      - name: Build Schema
        run: |
          git fetch origin main --depth=1 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^server/'; then
            echo "No backend changes detected; skipping schema build."
          else
            npm --prefix ../packages/schema install && npm --prefix ../packages/schema run build
          fi

      - name: Run lint
        run: |
          git fetch origin main --depth=1 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^server/'; then
            echo "No backend changes detected; skipping lint."
          else
            npm run lint
          fi

      - name: Run tests
        run: |
          git fetch origin main --depth=1 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^server/'; then
            echo "No backend changes detected; skipping tests."
          else
            npm test
          fi

      - name: Build backend
        run: |
          git fetch origin main --depth=1 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^server/'; then
            echo "No backend changes detected; skipping build."
          else
            npm run build
          fi

  # ── Gate: all jobs must pass ──────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [contracts, frontend, api]
    if: always()
    steps:
      - name: All jobs passed
        run: |
          if [[ "${{ needs.contracts.result }}" != "success" || \
                "${{ needs.frontend.result }}" != "success" || \
                "${{ needs.api.result }}" != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
