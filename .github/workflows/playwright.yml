name: Playwright Tests
on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Enable Corepack
      run: corepack enable
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - name: Fix invalid typescript resolution
      run: |
        node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));if(p.resolutions&&p.resolutions.typescript){delete p.resolutions.typescript;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');}"
        if [ -f yarn.lock ]; then rm -f yarn.lock; fi
    - name: Install dependencies
      run: yarn install
    - name: Install Playwright Browsers
      run: yarn playwright install --with-deps
    - name: Run Playwright tests
      run: yarn playwright test
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30