name: Playwright Tests
on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Enable Corepack
      run: corepack enable
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - name: Enable Corepack
      run: corepack enable
    - name: Install dependencies
      run: |
        git fetch origin main --depth=1 || true
        if git rev-parse --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^(src/|e2e/|playwright|package\.json|yarn\.lock)'; then
          echo "No UI or E2E changes detected; skipping yarn install."
        else
          yarn install --immutable
        fi
    - name: Run Playwright tests
      run: |
        git fetch origin main --depth=1 || true
        if git rev-parse --verify origin/main >/dev/null 2>&1 && ! git diff --name-only origin/main...HEAD | grep -qE '^(src/|e2e/|playwright|package\.json|yarn\.lock)'; then
          echo "No UI or E2E changes detected; skipping Playwright suite."
        else
          yarn playwright install --with-deps
          yarn playwright test
        fi
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30