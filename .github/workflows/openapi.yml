name: OpenAPI Contract Tests

# Runs on every PR and push to main/develop that touches:
#   - the schema file itself (docs/openapi.json)
#   - the server routes the schema documents
#   - the contract test itself
#   - this workflow file
#
# Purpose: fail CI when the documented schema drifts from the implemented
# routes, or when new endpoints are added without updating the schema.
# See server/src/tests/openapi.test.ts for the full contract test suite.

on:
  pull_request:
    paths:
      - "docs/openapi.json"
      - "server/src/routes/**"
      - "server/src/tests/openapi.test.ts"
      - "server/src/controllers/docsControllers.ts"
      - ".github/workflows/openapi.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "docs/openapi.json"
      - "server/src/routes/**"
      - "server/src/tests/openapi.test.ts"
      - "server/src/controllers/docsControllers.ts"
      - ".github/workflows/openapi.yml"

permissions:
  contents: read

jobs:
  openapi-contracts:
    name: OpenAPI Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate docs/openapi.json is parseable JSON
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const specPath = path.resolve(__dirname, '../docs/openapi.json');
            const spec = JSON.parse(fs.readFileSync(specPath, 'utf-8'));
            if (spec.openapi !== '3.0.3') process.exit(1);
            console.log('Schema valid. Paths:', Object.keys(spec.paths).length, 'Schemas:', Object.keys(spec.components.schemas).length);
          "
        working-directory: ${{ github.workspace }}

      - name: Run OpenAPI contract tests
        # Targets only the openapi test file so failures are clearly isolated
        # from other server test failures. The full suite still runs in the
        # main api job in ci.yml.
        run: npx vitest run src/tests/openapi.test.ts --reporter=verbose

      - name: Check all new route files are documented
        # Warns if any route file added in this PR introduces paths not yet
        # present in docs/openapi.json. Exits non-zero only on hard mismatches
        # caught by the contract tests above; this step provides diff context.
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const spec = JSON.parse(fs.readFileSync(path.resolve('../docs/openapi.json'), 'utf-8'));
            const documented = new Set(Object.keys(spec.paths));
            console.log('Documented paths (' + documented.size + '):');
            for (const p of [...documented].sort()) console.log(' ', p);
          "
